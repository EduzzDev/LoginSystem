
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: loginsystem-backend

    ports:
      - "3000:3000"

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_PATH: /data/LoginSystem.db
      FRONTEND_URL: http://localhost:5173

    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_data:/data
      - backend_uploads:/app/uploads

    command: pnpm dev

  frontend:
    build:
      context: ./login_system
      dockerfile: Dockerfile

    container_name: loginsystem-frontend

    ports:
      - "5173:5173"

    environment:
      VITE_BACKEND_URL: http://localhost:3000

    volumes:
      - ./login_system:/app
      - frontend_node_modules:/app/node_modules

    command: ["pnpm", "exec", "vite", "--host", "0.0.0.0"]

    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
  backend_data:
  backend_uploads:
